<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YewTube Connection Test</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    padding:30px;
}

button{
    width:100%;
    padding:18px;
    font-size:18px;
    margin-top:20px;
}

#hasil{
    margin-top:20px;
    padding:15px;
    background:#222;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<h1>YewTube Connection Test</h1>

<button onclick="testYewTube()">
TES YEW TUBE
</button>

<div id="hasil">
Belum dites.
</div>

<script>

async function testYewTube(){

    const hasil =
        document.getElementById("hasil");

    hasil.innerText =
        "⏳ Menghubungi YewTube...";

    try{

        const response =
            await fetch(
                "https://yewtu.be/api/v1/stats"
            );

        hasil.innerText =
            "HTTP STATUS: " +
            response.status +
            "\n\n" +
            "Koneksi ke YewTube berhasil! 🟢";

    }catch(error){

        hasil.innerText =
            "❌ LOAD FAILED\n\n" +
            error.message +
            "\n\n" +
            "YewTube tidak dapat diakses langsung dari browser.";

        console.log(error);

    }

}

</script>

</body>
</html>
