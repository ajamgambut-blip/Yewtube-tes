<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YewTube API Test</title>

<style>
body{
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  padding:25px;
}

input,button{
  width:100%;
  padding:15px;
  margin-top:10px;
  box-sizing:border-box;
  border-radius:10px;
}

input{
  background:#222;
  color:#fff;
  border:1px solid #555;
}

button{
  background:#fff;
  border:0;
  font-weight:bold;
}

#result{
  margin-top:20px;
  padding:15px;
  background:#222;
  border-radius:10px;
  white-space:pre-wrap;
  word-break:break-word;
}
</style>
</head>

<body>

<h2>YewTube API Test</h2>

<input
id="video"
placeholder="Masukkan URL YouTube"
>

<button onclick="test()">
TEST API VIDEO
</button>

<div id="result">
Belum dites.
</div>

<script>

async function test(){

  const result =
    document.getElementById("result");

  const value =
    document.getElementById("video").value.trim();

  result.innerText =
    "⏳ Memproses...";

  let id;

  try{

    const url =
      new URL(value);

    if(url.hostname.includes("youtu.be")){

      id =
        url.pathname
        .split("/")
        .filter(Boolean)[0];

    }else{

      id =
        url.searchParams.get("v");

    }

  }catch(e){

    result.innerText =
      "❌ URL tidak valid";

    return;

  }

  if(!id){

    result.innerText =
      "❌ Video ID tidak ditemukan";

    return;

  }

  result.innerText =
    "ID ditemukan:\n"+
    id+
    "\n\n"+
    "⏳ Request ke YewTube...";


  try{

    const url =
      "https://yewtu.be/api/v1/videos/" +
      id;

    console.log("Request:",url);

    const response =
      await fetch(url);

    console.log(
      "Status:",
      response.status
    );


    const text =
      await response.text();

    console.log(text);


    if(!response.ok){

      result.innerText =
        "❌ HTTP ERROR\n\n"+
        response.status+
        "\n\n"+
        text.substring(0,1000);

      return;

    }


    result.innerText =
      "🟢 REQUEST BERHASIL!\n\n"+
      "HTTP: "+
      response.status+
      "\n\n"+
      "Response awal:\n"+
      text.substring(0,1500);


  }catch(error){

    console.error(error);

    result.innerText =
      "❌ LOAD FAILED\n\n"+
      error.name+
      "\n"+
      error.message+
      "\n\n"+
      "Request ke endpoint video gagal.";

  }

}

</script>

</body>
</html>
