<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>YouTube PWA Test</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:#101114;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

.card{
  max-width:600px;
  margin:auto;
  background:#1b1d22;
  padding:20px;
  border-radius:24px;
}

h1{
  margin-top:0;
}

input{
  width:100%;
  padding:15px;
  background:#111;
  border:1px solid #444;
  color:white;
  border-radius:12px;
  font-size:15px;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
}

#player{
  width:100%;
  aspect-ratio:16/9;
  margin-top:20px;
  border-radius:15px;
  overflow:hidden;
}

#status{
  margin-top:15px;
  padding:14px;
  background:#111;
  border-radius:12px;
  white-space:pre-wrap;
}

.green{
  color:#6ee7a0;
}

.red{
  color:#ff6975;
}

</style>
</head>

<body>

<div class="card">

<h1>▶️ YouTube PWA Test</h1>

<p>
Masukkan link YouTube lalu tekan PLAY.
</p>

<input
  id="url"
  placeholder="https://www.youtube.com/watch?v=..."
>

<button onclick="loadVideo()">
LOAD YOUTUBE
</button>

<div id="player"></div>

<div id="status">
Status: Menunggu...
</div>

</div>


<script>

/*
=====================================
YOUTUBE IFRAME API
=====================================
*/

let player=null;

let apiReady=false;

let pendingVideo=null;


/*
Load API
*/

const tag=
document.createElement("script");

tag.src=
"https://www.youtube.com/iframe_api";

document.head.appendChild(tag);


/*
YouTube memanggil fungsi ini
*/

function onYouTubeIframeAPIReady(){

  apiReady=true;

  document.getElementById("status")
    .innerText=
      "🟢 YouTube Player API siap.\n\n"+
      "Masukkan link YouTube.";

  if(pendingVideo){

    createPlayer(
      pendingVideo
    );

    pendingVideo=null;

  }

}


/*
=====================================
AMBIL VIDEO ID
=====================================
*/

function getVideoId(value){

  value=value.trim();

  /*
  ID langsung
  */

  if(
    /^[A-Za-z0-9_-]{11}$/.test(value)
  ){

    return value;

  }


  try{

    const url=
      new URL(value);


    /*
    youtube.com/watch?v=
    */

    const v=
      url.searchParams.get("v");

    if(v){

      return v;

    }


    /*
    youtu.be
    */

    if(
      url.hostname.includes("youtu.be")
    ){

      return url.pathname
        .split("/")
        .filter(Boolean)[0];

    }


    /*
    shorts
    */

    const parts=
      url.pathname
        .split("/")
        .filter(Boolean);

    const shorts=
      parts.indexOf("shorts");

    if(
      shorts>=0 &&
      parts[shorts+1]
    ){

      return parts[shorts+1];

    }

  }catch(e){

  }

  return null;

}


/*
=====================================
LOAD VIDEO
=====================================
*/

function loadVideo(){

  const input=
    document.getElementById("url");

  const status=
    document.getElementById("status");

  const id=
    getVideoId(input.value);


  if(!id){

    status.innerText=
      "❌ Link YouTube tidak valid.";

    return;

  }


  status.innerText=
    "⏳ Video ID ditemukan:\n"+
    id+
    "\n\nMenyiapkan YouTube Player...";


  if(!apiReady){

    pendingVideo=id;

    status.innerText+=
      "\n\nMenunggu YouTube API...";

    return;

  }


  createPlayer(id);

}


/*
=====================================
CREATE PLAYER
=====================================
*/

function createPlayer(id){

  if(player){

    player.destroy();

  }


  document.getElementById("player")
    .innerHTML="";


  player=
    new YT.Player(
      "player",
      {

        width:"100%",

        height:"100%",

        videoId:id,

        playerVars:{

          /*
          Tetap inline di iPhone
          */

          playsinline:1,

          /*
          Kontrol YouTube tetap ada
          */

          controls:1,

          /*
          Jangan autoplay dulu.
          User harus menekan play.
          */

          autoplay:0,

          /*
          Related videos tetap dari channel
          */

          rel:0

        },

        events:{

          onReady:
            onPlayerReady,

          onStateChange:
            onPlayerStateChange,

          onError:
            onPlayerError

        }

      }
    );

}


/*
=====================================
PLAYER READY
=====================================
*/

function onPlayerReady(event){

  document.getElementById("status")
    .innerText=
      "🟢 YOUTUBE PLAYER SIAP.\n\n"+
      "Tekan ▶️ pada video.";

}


/*
=====================================
STATE
=====================================
*/

function onPlayerStateChange(event){

  const status=
    document.getElementById("status");


  if(
    event.data ===
    YT.PlayerState.PLAYING
  ){

    status.innerText=
      "🟢 SEDANG PLAYING\n\n"+
      "Sekarang coba:\n"+
      "1. Kunci layar iPhone\n"+
      "2. Tunggu 5–10 detik\n"+
      "3. Lihat apakah audio tetap berjalan.";


    setupMediaSession();

  }


  else if(
    event.data ===
    YT.PlayerState.PAUSED
  ){

    status.innerText=
      "⏸️ PAUSED";

  }


  else if(
    event.data ===
    YT.PlayerState.ENDED
  ){

    status.innerText=
      "⏹️ VIDEO SELESAI";

  }

}


/*
=====================================
ERROR
=====================================
*/

function onPlayerError(event){

  document.getElementById("status")
    .innerText=
      "❌ YOUTUBE PLAYER ERROR\n\n"+
      "Error code: "+
      event.data;

}


/*
=====================================
MEDIA SESSION
=====================================
*/

function setupMediaSession(){

  if(
    !("mediaSession" in navigator)
  ){

    return;

  }


  navigator.mediaSession.metadata=
    new MediaMetadata({

      title:
        "YouTube Online",

      artist:
        "YouTube PWA"

    });


  try{

    navigator.mediaSession
      .setActionHandler(
        "play",
        function(){

          if(player){

            player.playVideo();

          }

        }
      );


    navigator.mediaSession
      .setActionHandler(
        "pause",
        function(){

          if(player){

            player.pauseVideo();

          }

        }
      );

  }catch(e){

    console.log(
      "Media Session:",
      e
    );

  }

}

</script>

</body>
</html>
